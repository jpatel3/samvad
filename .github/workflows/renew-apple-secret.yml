name: Renew Apple Client Secret

# Runs every 5 months (Apple JWTs max out at 6 months)
on:
  schedule:
    - cron: '0 0 1 */5 *' # 1st day of every 5th month
  workflow_dispatch: # Allow manual trigger

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate new Apple client secret JWT
        run: |
          echo "${{ secrets.APPLE_P8_KEY }}" > /tmp/apple.p8
          JWT=$(node scripts/generate-apple-secret.mjs \
            --team-id "${{ secrets.APPLE_TEAM_ID }}" \
            --key-id "${{ secrets.APPLE_KEY_ID }}" \
            --client-id "${{ secrets.APPLE_CLIENT_ID }}" \
            --key-file /tmp/apple.p8 2>/dev/null | grep -A1 "===" | tail -1)
          rm /tmp/apple.p8
          echo "::add-mask::$JWT"
          echo "APPLE_JWT=$JWT" >> "$GITHUB_ENV"

      - name: Update Supabase Apple provider
        run: |
          curl -sf -X PATCH \
            "https://api.supabase.com/v1/projects/${{ secrets.SUPABASE_PROJECT_REF }}/config/auth" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ACCESS_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"EXTERNAL_APPLE_SECRET\": \"$APPLE_JWT\"}"
          echo "Apple client secret renewed successfully"
